name: Activity → Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *' # Daily 08:17 Asia/Taipei (UTC+8).

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: python scripts/validate.py
      - name: Require dedicated activity token
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ACTIVITY_TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ -z "$ACTIVITY_TOKEN" ]; then
            echo '::error::Add repository Actions secret TOKEN before collecting activity.'
            exit 1
          fi
      - name: Update README activity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: TheDanniCraft/activity-log@130ff6ba97c30b2d272f27851db0a347b29472af # v1
        with:
          GITHUB_USERNAME: cuhsuan
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          EVENT_LIMIT: '8'
          OUTPUT_STYLE: MARKDOWN
          HIDE_DETAILS_ON_PRIVATE_REPOS: 'true'
          COMMIT_MESSAGE: 'docs(activity): refresh recent GitHub activity'
      - name: Fetch the README commit created through GitHub API
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: git pull --ff-only origin main
      - name: Require generated activity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/validate.py --require-activity
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated site
        run: python scripts/validate.py --site _site
      - name: Set up browser runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install screenshot tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile evidence
        run: node scripts/capture.mjs
      - name: Save visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-evidence
          path: evidence/*.png
          retention-days: 30
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Write run evidence
        if: always()
        run: |
          echo "## Activity → Pages evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://cuhsuan.github.io/devops-pages-lab/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-live:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up browser runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify the public URL and capture screenshots
        env:
          LIVE_URL: https://cuhsuan.github.io/devops-pages-lab/
          REQUIRE_ACTIVITY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/capture.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Save live website evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-site-evidence
          path: evidence/live-*.png
          retention-days: 30
